version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: digitalcards-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: digitalcards
      POSTGRES_USER: digitalcards
      POSTGRES_PASSWORD: digitalcards_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U digitalcards']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: digitalcards-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digitalcards-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: digitalcards
      DATABASE_PASSWORD: digitalcards_dev
      DATABASE_NAME: digitalcards
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-jwt-secret-do-not-use-in-prod
      JWT_REFRESH_SECRET: dev-refresh-secret-do-not-use-in-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digitalcards-worker
    restart: unless-stopped
    command: ['node', 'dist/main']
    environment:
      NODE_ENV: development
      WORKER_MODE: 'true'
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: digitalcards
      DATABASE_PASSWORD: digitalcards_dev
      DATABASE_NAME: digitalcards
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
