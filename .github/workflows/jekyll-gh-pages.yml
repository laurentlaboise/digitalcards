name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["master", "claude/design-saas-landing-page-D6EMw"]
    paths:
      - "digital-card-platform/**"
      - ".github/workflows/jekyll-gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: digital-card-platform/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: digital-card-platform
        run: npm ci

      - name: Configure for static export
        working-directory: digital-card-platform
        run: |
          # Switch Next.js to static export mode
          cat > next.config.mjs << 'CONF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            images: { unoptimized: true },
            trailingSlash: true,
          };
          export default nextConfig;
          CONF

          # Remove all server-only routes incompatible with static export
          rm -rf src/app/api
          rm -rf src/app/card
          rm -rf src/app/dashboard/cards/*/edit

      - name: Build static site
        working-directory: digital-card-platform
        run: npx next build
        env:
          NEXTAUTH_SECRET: static-build-placeholder
          NEXTAUTH_URL: https://izzi.work

      - name: Add CNAME for custom domain
        run: echo "izzi.work" > digital-card-platform/out/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: digital-card-platform/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
